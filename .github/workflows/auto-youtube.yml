name: Mega Quiz Auto-Uploader (Long Video)

on:
  schedule:
    # यह बॉट हर दिन सुबह 8:00 बजे (UTC 02:30) और शाम 6:00 बजे चलेगा
    - cron: '30 2,12 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # ⚠️ वीडियो लंबी है इसलिए GitHub को 3 घंटे का टाइमआउट दिया है
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick
        sudo sed -i 's/rights="none"/rights="read|write"/' /etc/ImageMagick-6/policy.xml

    - name: Install Python Libraries
      run: |
        pip install --upgrade pip
        pip install moviepy==1.0.3 edge-tts gtts numpy google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow==9.5.0 imageio-ffmpeg

    - name: Load All YouTube Tokens
      env:
        TOKEN_1: ${{ secrets.TOKEN_1 }}
        TOKEN_2: ${{ secrets.TOKEN_2 }}
      run: |
        mkdir -p tokens
        if [ ! -z "$TOKEN_1" ]; then echo "$TOKEN_1" | base64 -d > tokens/token1.json; fi
        if [ ! -z "$TOKEN_2" ]; then echo "$TOKEN_2" | base64 -d > tokens/token2.json; fi
        echo "✅ Tokens लोड हो गए हैं!"

    - name: Run Auto-Bot for 100 Questions
      run: |
        python bot.py

    - name: Commit updated questions.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add questions.json
        git commit -m "🤖 100 सवाल इस्तेमाल किए गए और वीडियो अपलोड हो गई" || echo "No changes to commit"
        git push
